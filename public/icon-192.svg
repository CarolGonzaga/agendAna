  <path d="M 160 160 Q 160 180 140 180 Q 160 180 160 200 Q 160 180 180 180 Q 160 180 160 160 Z" fill="#FDE68A"/>
  <path d="M 370 190 Q 370 205 355 205 Q 370 205 370 220 Q 370 205 385 205 Q 370 205 370 190 Z" fill="#FDE68A"/>
  <path d="M 190 340 Q 190 350 180 350 Q 190 350 190 360 Q 190 350 200 350 Q 190 350 190 340 Z" fill="#E9D5FF"/>
