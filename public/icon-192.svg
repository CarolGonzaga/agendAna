  <path d="M 290 140 C 230 140 180 190 180 256 C 180 322 230 372 290 372 C 325 372 355 356 374 330 C 315 335 265 290 265 230 C 265 185 295 152 335 142 C 321 140 306 140 290 140 Z" fill="url(#moonGrad)" filter="url(#glow)"/>
